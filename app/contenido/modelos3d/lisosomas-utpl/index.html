<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>El lisosoma</title>
<style>
  :root{ --brand:#E54D28; --amber:#F59324; --teal:#5FBF9A; --coral:#ED6938; --dark:#C0272A; }
  body.tema-claro{
    --bg:radial-gradient(ellipse at 50% 38%, #f7f8fa 0%, #eceef2 52%, #d9dde3 100%);
    --txt:#1f2937; --txt2:#6b7280; --panel:rgba(255,255,255,.64); --panel-b:rgba(255,255,255,.95);
    --shadow:0 12px 34px rgba(70,80,100,.16); --row-on:rgba(229,77,40,.12); --chip:rgba(31,41,55,.06);
    --dato:rgba(245,147,36,.14); --decor-o:.95; --line-sh:rgba(255,255,255,.9);
  }
  body.tema-oscuro{
    --bg:radial-gradient(ellipse at 50% 50%, #808080 0%, #5c5c5c 45%, #3a3a3a 100%);
    --txt:#f6f6f6; --txt2:#cfcfcf; --panel:rgba(16,18,24,.5); --panel-b:rgba(255,255,255,.18);
    --shadow:0 12px 34px rgba(0,0,0,.4); --row-on:rgba(245,147,36,.22); --chip:rgba(255,255,255,.1);
    --dato:rgba(245,147,36,.18); --decor-o:.8; --line-sh:rgba(255,255,255,.35);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; font-family:"Poppins","Nunito","Segoe UI","Trebuchet MS",system-ui,Roboto,Arial,sans-serif; color:var(--txt); }
  body{ background:var(--bg); transition:color .4s; }
  button{ font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; }
  .glass{ background:var(--panel); border:1px solid var(--panel-b); box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.25);
          -webkit-backdrop-filter:blur(16px) saturate(140%); backdrop-filter:blur(16px) saturate(140%); }

  /* decoración low-poly de marca */
  #decor{ position:absolute; inset:0; pointer-events:none; z-index:0; opacity:var(--decor-o); transition:opacity .6s; }
  #decor svg{ position:absolute; overflow:visible; animation:drift 14s ease-in-out infinite; }
  body.sin-mov #decor svg, body.sin-mov .mascot-bird{ animation:none !important; }
  @keyframes drift{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(0,-1.2vmin); } }

  #c{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; z-index:1; }
  #lines{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; transition:opacity .4s; }
  #lines line{ stroke-width:2.2; stroke-linecap:round; }
  #lines circle{ stroke:#fff; stroke-width:2.5; filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  #pills{ position:absolute; inset:0; pointer-events:none; z-index:3; transition:opacity .4s; }
  .pill{ position:absolute; top:0; left:0; padding:.42em 1.05em; border-radius:999px; background:var(--c); color:#fff; font-weight:700;
         font-size:clamp(13px,1.9vmin,21px); white-space:nowrap; border:2px solid rgba(255,255,255,.9);
         box-shadow:0 6px 16px rgba(0,0,0,.22); pointer-events:auto; cursor:pointer; transition:opacity .3s, filter .3s; will-change:transform; }
  .pill.sub{ font-size:clamp(11px,1.55vmin,17px); font-weight:600; padding:.3em .85em; }
  .pill.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .pill.dim{ opacity:.88; filter:saturate(.7); }
  .pill.occ{ opacity:.5; }
  .pill.sel{ box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent), 0 8px 20px rgba(0,0,0,.28); }

  /* cabecera */
  #head{ position:absolute; left:26px; top:18px; z-index:4; pointer-events:none; transition:transform .5s cubic-bezier(.3,.8,.3,1), opacity .4s; }
  #head h1{ margin:0; font-size:clamp(24px,4.1vmin,46px); font-weight:800; letter-spacing:-.3px; }
  #head p{ margin:2px 0 0; color:var(--txt2); font-size:clamp(12px,1.8vmin,19px); font-weight:500; }
  #top{ position:absolute; right:18px; top:16px; z-index:5; display:flex; gap:4px; padding:6px; border-radius:999px; transition:transform .5s cubic-bezier(.3,.8,.3,1), opacity .4s; }
  .ib{ width:clamp(40px,5.6vmin,56px); height:clamp(40px,5.6vmin,56px); border-radius:50%; display:grid; place-items:center; transition:background .2s; }
  .ib:active{ background:var(--chip); }
  .ib svg{ width:55%; height:55%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #pop{ position:absolute; right:18px; top:calc(clamp(40px,5.6vmin,56px) + 30px); z-index:6; width:min(300px,86vw); border-radius:20px; padding:14px 16px; display:none; }
  #pop.show{ display:block; }
  #pop h3{ margin:0 0 8px; font-size:15px; }
  .sw{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 2px; font-weight:600; font-size:15px; width:100%; }
  .sw i{ width:46px; height:26px; border-radius:999px; background:var(--chip); position:relative; flex:none; transition:background .2s; }
  .sw i::after{ content:""; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35); transition:transform .2s; }
  .sw[aria-checked="true"] i{ background:var(--brand); }
  .sw[aria-checked="true"] i::after{ transform:translateX(20px); }

  /* panel izquierdo */
  .panel{ position:absolute; z-index:4; border-radius:24px; transition:transform .55s cubic-bezier(.3,.8,.3,1), opacity .4s; }
  #left{ left:18px; top:clamp(84px,14vh,140px); width:clamp(230px,19vw,340px); padding:14px 12px 12px; max-height:calc(100vh - clamp(84px,14vh,140px) - clamp(120px,19vh,180px)); overflow:auto; }
  #left h2{ margin:6px 10px 6px; font-size:clamp(13px,1.8vmin,18px); font-weight:700; }
  #left h2.o{ margin-top:12px; padding-top:10px; border-top:1px solid var(--chip); }
  .row{ display:flex; align-items:center; gap:12px; width:100%; padding:7px 10px; border-radius:16px; font-weight:600; font-size:clamp(14px,2vmin,20px); text-align:left; transition:background .2s; }
  .row.on{ background:var(--row-on); }
  .row .rn{ flex:1; }
  .row .chev{ width:18px; height:18px; fill:none; stroke:var(--txt2); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .hex{ width:clamp(34px,5vmin,46px); height:clamp(34px,5vmin,46px); display:grid; place-items:center; flex:none; background:var(--c);
        clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%); }
  .hex svg{ width:56%; height:56%; fill:none; stroke:#fff; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

  /* panel derecho */
  #right{ right:18px; top:clamp(110px,22vh,210px); width:clamp(250px,21vw,370px); padding:18px 18px 14px; }
  #ih{ display:flex; align-items:center; gap:14px; }
  #it{ margin:0; font-size:clamp(22px,3.4vmin,36px); font-weight:800; }
  #ib{ transition:opacity .2s, transform .2s; }
  #ib.out{ opacity:0; transform:translateY(6px); }
  #itx{ margin:14px 0 14px; font-size:clamp(14px,1.95vmin,19px); line-height:1.5; }
  #dato{ background:var(--dato); border-radius:16px; padding:12px 14px; display:flex; gap:12px; align-items:flex-start; }
  #dato svg{ width:30px; height:30px; flex:none; fill:none; stroke:var(--amber); stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  #dato b{ display:block; color:var(--brand); font-size:clamp(14px,1.9vmin,19px); margin-bottom:2px; }
  #dato span{ font-size:clamp(12px,1.65vmin,16px); line-height:1.4; color:var(--txt2); }
  #pg{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  #pg .ib{ width:40px; height:40px; }
  #dots{ display:flex; gap:8px; }
  #dots button{ width:11px; height:11px; border-radius:50%; background:var(--chip); transition:background .2s, transform .2s; }
  #dots button.on{ background:var(--brand); transform:scale(1.2); }

  /* barra de herramientas */
  #tools{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:5; display:flex; gap:clamp(4px,1.2vw,18px); padding:10px clamp(14px,2vw,28px) 8px; border-radius:999px; transition:transform .55s cubic-bezier(.3,.8,.3,1), opacity .4s; }
  .tool{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:clamp(11px,1.6vmin,17px); font-weight:600; color:var(--txt2); padding:2px clamp(6px,1vw,14px); position:relative; }
  .tool .ti{ width:clamp(40px,6.6vmin,64px); height:clamp(40px,6.6vmin,64px); border-radius:50%; display:grid; place-items:center; transition:background .25s, color .25s, transform .2s; }
  .tool .ti svg{ width:48%; height:48%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .tool:active .ti{ transform:scale(.93); }
  .tool.on{ color:var(--txt); }
  .tool.on .ti{ background:var(--brand); color:#fff; box-shadow:0 8px 18px rgba(229,77,40,.4); }
  .tool.on::after{ content:""; position:absolute; left:22%; right:22%; bottom:-6px; height:3px; border-radius:3px; background:var(--brand); }

  /* botón Vista 3D */
  #v3d{ position:absolute; right:18px; bottom:16px; z-index:6; display:flex; align-items:center; gap:12px; padding:8px 20px 8px 10px; border-radius:999px; font-weight:700; color:var(--brand); font-size:clamp(14px,2vmin,20px); transition:transform .2s; }
  #v3d:active{ transform:scale(.96); }
  #v3d .vi{ width:clamp(38px,5.6vmin,52px); height:clamp(38px,5.6vmin,52px); border-radius:50%; background:var(--brand); color:#fff; display:grid; place-items:center; }
  #v3d .vi svg{ width:52%; height:52%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* modo Vista 3D: interfaz oculta */
  body.compacto #left{ padding:10px 10px 8px; top:clamp(94px,13vh,130px); max-height:calc(100vh - clamp(94px,13vh,130px) - clamp(104px,16vh,150px)); }
  body.compacto #left .row{ padding:2px 8px; gap:9px; margin:0; font-size:clamp(12px,1.7vmin,17px); }
  body.compacto #left .hex{ width:clamp(26px,3.7vmin,36px); height:clamp(26px,3.7vmin,36px); }
  body.compacto #left h2{ margin:0 0 4px; }
  body.compacto #left h2.o{ margin-top:6px; padding-top:6px; }
  body.sin-partes #left{ display:none; }
  body.sin-info #right{ transform:translateX(135%); opacity:0; pointer-events:none; }
  body.v3d #left{ transform:translateX(-135%); opacity:0; }
  body.v3d #right{ transform:translateX(135%); opacity:0; }
  body.v3d #tools{ transform:translate(-50%,160%); opacity:0; }
  body.v3d #head, body.v3d #top{ transform:translateY(-170%); opacity:0; }
  body.v3d #pills, body.v3d #lines, body.v3d #decor{ opacity:0; pointer-events:none; }
  body.v3d .pill{ pointer-events:none; }
  body.v3d #pop{ display:none; }

  /* consejero (logo) */
  #mascot{ position:absolute; left:18px; bottom:22px; z-index:8; display:flex; align-items:flex-end; gap:6px; pointer-events:none;
           opacity:0; transform:translateY(14px) scale(.96); transform-origin:bottom left; transition:opacity .35s ease, transform .35s ease; }
  #mascot.show{ opacity:1; transform:none; }
  .mascot-bird{ width:clamp(100px,16vmin,170px); filter:drop-shadow(0 0 7px rgba(255,255,255,.95)) drop-shadow(0 8px 12px rgba(0,0,0,.28)); animation:flap 2.4s ease-in-out infinite; }
  @keyframes flap{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-6px) rotate(3deg); } }
  #bubble{ position:relative; max-width:clamp(180px,22vmin,260px); padding:12px 16px; border-radius:20px; border-bottom-left-radius:6px; margin-bottom:18px; background:#fff; color:#1f2937; box-shadow:0 10px 28px rgba(0,0,0,.25); }
  #bubble::after{ content:""; position:absolute; left:-9px; bottom:12px; width:18px; height:18px; background:#fff; transform:rotate(45deg); border-radius:3px; }
  #bubble b{ display:block; font-size:clamp(15px,2.1vmin,22px); }
  #bubble span{ font-size:clamp(12px,1.6vmin,16px); color:#5b6472; line-height:1.35; display:block; margin-top:2px; }

  #load{ position:absolute; inset:0; display:grid; place-items:center; font-size:20px; z-index:9; }

  /* créditos */
  #modal{ position:absolute; inset:0; display:none; place-items:center; z-index:20; background:rgba(0,0,0,.35); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); }
  #modal.show{ display:grid; }
  #card{ position:relative; width:min(680px,92vw); max-height:88vh; overflow:auto; border-radius:26px; padding:30px 30px 24px;
         -webkit-backdrop-filter:blur(26px) saturate(160%); backdrop-filter:blur(26px) saturate(160%); }
  body.tema-claro #card{ background:rgba(255,255,255,.78); }
  body.tema-oscuro #card{ background:rgba(16,18,24,.62); }
  #card::before{ content:""; position:absolute; left:0; right:0; top:0; height:7px; border-radius:26px 26px 0 0;
                 background:linear-gradient(90deg,var(--teal) 0 25%,var(--amber) 25% 50%,var(--coral) 50% 75%,var(--dark) 75% 100%); }
  #card h2{ margin:4px 0 14px; font-size:24px; }
  #card dl{ margin:0; display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:16px; }
  #card dt{ color:var(--txt2); } #card dd{ margin:0; word-break:break-word; }
  #card .attr{ margin-top:16px; padding:12px 14px; background:var(--chip); border-radius:12px; font-size:13px; word-break:break-word; }
  #card .row2{ display:flex; justify-content:flex-end; margin-top:18px; }
  #btnClose{ padding:10px 22px; border-radius:999px; background:var(--brand); color:#fff; font-weight:700; min-height:46px; }
  @media (prefers-reduced-motion:reduce){ #decor svg, .mascot-bird{ animation:none; } }
</style>

<body class="tema-claro">
<div id="decor"></div>
<canvas id="c"></canvas>
<svg id="lines"></svg>
<div id="pills"></div>

<div id="head"><h1 id="t"></h1><p id="st"></p></div>

<div id="top" class="glass">
  <button class="ib" id="bTema" aria-label="Cambiar fondo"></button>
  <button class="ib" id="bInfo" aria-label="Créditos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
  <button class="ib" id="bSet" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="18" cy="18" r="2.2"/></svg></button>
</div>
<div id="pop" class="glass">
  <h3>Ajustes</h3>
  <button class="sw" id="swEt" role="switch" aria-checked="true">Etiquetas sobre el modelo<i></i></button>
  <button class="sw" id="swIn" role="switch" aria-checked="true" style="display:none">Panel de información<i></i></button>
  <button class="sw" id="swAy" role="switch" aria-checked="true">Consejero<i></i></button>
  <button class="sw" id="swMo" role="switch" aria-checked="true">Animaciones<i></i></button>
</div>

<aside id="left" class="panel glass"></aside>

<aside id="right" class="panel glass">
  <div id="ih"><span class="hex" id="iic"></span><h2 id="it"></h2></div>
  <div id="ib">
    <p id="itx"></p>
    <div id="dato"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><div><b>Dato curioso</b><span id="dtx"></span></div></div>
  </div>
  <div id="pg">
    <button class="ib" id="pPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="dots"></div>
    <button class="ib" id="pNext" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</aside>

<nav id="tools" class="glass"></nav>
